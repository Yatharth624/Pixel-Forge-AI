version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pixelforge-postgres
    environment:
      POSTGRES_DB: pixelforgedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  cv-service:
    build:
      context: ./cv-service
      dockerfile: Dockerfile
    container_name: pixelforge-cv-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelforge-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/pixelforgedb
      - DB_USER=postgres
      - DB_PASS=postgrespassword
      - DB_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - DB_DRIVER=org.postgresql.Driver
      - CV_SERVICE_URL=http://cv-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      cv-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pixelforge-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
